<title>政治顏色卡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: single column app, color-spectrum identity quiz. Intro → one question per screen with 4 stacked answers → result: generated trading-card image (saveable), axis readout, all types gallery. Card-collecting vibe: chunky outlines, sticker shadows. */
:root{
  --bg:#f3f0ea; --paper:#ffffff; --ink:#1c1b22; --mute:#6c6a73; --rule:#dedad2; --accent:#ff5a3c; --hl:#fff1c2;
  --f-body:"Noto Sans TC",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15141a;--paper:#211f28;--ink:#f1eee8;--mute:#a19ea8;--rule:#36333f;--accent:#ff7a5e;--hl:#3a3420;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15141a;--paper:#211f28;--ink:#f1eee8;--mute:#a19ea8;--rule:#36333f;--accent:#ff7a5e;--hl:#3a3420;color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body)}
.wrap{max-width:480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:22px 40px;display:grid;gap:16px}
h1{font:900 40px/1.1 var(--f-body);margin:0;letter-spacing:.01em;text-wrap:balance}
h1 em{font-style:normal;background:var(--accent);color:#fff;padding:0 8px;border-radius:8px;display:inline-block;transform:rotate(-2deg)}
.lead{margin:0;color:var(--mute);font-size:15px;line-height:1.7}
.mascots{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.spec{display:flex;flex-wrap:wrap;gap:6px}
.spec span{font:700 12px var(--f-body);color:#fff;padding:4px 9px;border-radius:999px;text-shadow:0 1px 0 #0004}
.mascots canvas{width:100%;height:auto;aspect-ratio:1;max-width:100%}
.btn{font:900 18px var(--f-body);border:2.5px solid var(--ink);border-radius:14px;padding:14px;background:var(--accent);color:#fff;cursor:pointer;box-shadow:4px 4px 0 var(--ink);touch-action:manipulation}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.btn.ghost{background:var(--paper);color:var(--ink)}
.note{font-size:12px;color:var(--mute);line-height:1.6;margin:0}
.prog{display:flex;align-items:center;gap:10px;font:700 13px var(--f-body);color:var(--mute);padding-right:52px}
.prog .trk{flex:1;height:8px;background:var(--rule);border-radius:4px;overflow:hidden}
.prog .trk i{display:block;height:100%;background:var(--accent);transition:width .3s}
.q{font:900 23px/1.45 var(--f-body);margin:4px 0 0;text-wrap:balance}
.opts{display:grid;gap:10px}
.opt{font:500 16px/1.5 var(--f-body);text-align:left;border:2px solid var(--ink);border-radius:12px;background:var(--paper);color:var(--ink);padding:13px 14px;cursor:pointer;
  box-shadow:3px 3px 0 var(--ink);display:grid;grid-template-columns:26px 1fr;gap:8px;align-items:start;animation:in .3s cubic-bezier(.2,1.3,.5,1) backwards}
.opt:nth-child(2){animation-delay:.05s}.opt:nth-child(3){animation-delay:.1s}.opt:nth-child(4){animation-delay:.15s}
@keyframes in{from{transform:translateY(12px);opacity:0}}
.opt b{font:900 16px var(--f-body);color:var(--accent)}
@media (hover:hover){.opt:hover:not(:disabled){background:var(--hl)}}
.opt:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.opt:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.back{justify-self:start;background:none;border:0;color:var(--mute);font:500 14px var(--f-body);cursor:pointer;padding:4px 0}
.cardimg{width:100%;max-width:100%;border-radius:18px;box-shadow:0 18px 40px -20px #0007;display:block;animation:flip .6s cubic-bezier(.2,1.3,.5,1)}
@keyframes flip{from{transform:perspective(800px) rotateY(80deg) scale(.8);opacity:0}}
.save{font:500 13px var(--f-body);color:var(--mute);text-align:center;margin:0}
.axes{background:var(--paper);border:2px solid var(--ink);border-radius:14px;padding:14px;display:grid;gap:12px}
.ax{display:grid;gap:4px;font-size:13px}
.ax .ends{display:flex;justify-content:space-between;color:var(--mute);font-size:12px}
.ax .trk{position:relative;height:10px;border-radius:5px;background:linear-gradient(90deg,#1f3f8f,#6b93d6 30%,#d9d6cf 50%,#8fcf8a 70%,#147a4c)}
.ax .trk.e{background:linear-gradient(90deg,#c9c4bb,#ff5a3c)} .ax .trk.r{background:linear-gradient(90deg,#c9c4bb,#8bbf3f)}
.ax .dot{position:absolute;top:50%;width:18px;height:18px;border-radius:50%;background:var(--paper);border:3px solid var(--ink);transform:translate(-50%,-50%);transition:left .6s cubic-bezier(.2,1.3,.5,1)}
.ax b{font:700 14px var(--f-body)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
h2{font:900 20px var(--f-body);margin:8px 0 0}
.gal{display:grid;gap:10px}
.gi{display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:center;background:var(--paper);border:1.5px solid var(--rule);border-radius:12px;padding:10px}
.gi canvas{width:56px;height:56px}
.gi b{font:900 16px var(--f-body)} .gi span{font-size:13px;color:var(--mute);line-height:1.5;display:block}
.gi.me{border:2.5px solid var(--ink);background:var(--hl)}
#shareText{-webkit-user-select:text;user-select:text;width:100%;box-sizing:border-box;font:500 15px/1.6 var(--f-body);color:var(--ink);background:var(--bg);border:1.5px solid var(--rule);border-radius:10px;padding:10px 12px;resize:vertical}
#shareText:focus-visible{outline:2px solid var(--accent)}
.sharebox{background:var(--paper);border:2px solid var(--ink);border-radius:14px;padding:14px;display:grid;gap:10px}
.shead{display:grid;gap:8px}
.shead b{font:900 16px var(--f-body)}
.vtabs{display:grid;grid-template-columns:repeat(3,1fr);border:1.5px solid var(--ink);border-radius:999px;overflow:hidden;width:100%}
.srow{display:flex;gap:10px}.srow .btn{flex:1}
.vtabs button{font:700 12px var(--f-body);background:transparent;border:0;color:var(--ink);padding:6px 10px;cursor:pointer}
.vtabs button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.vtabs button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.hint{margin:0;font-size:12px;color:var(--mute)}
.optout{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--mute)}
.optout input{width:18px;height:18px;accent-color:var(--accent)}
.toast{margin:0;font:700 13px var(--f-body);color:var(--accent);min-height:1.2em;opacity:0}
.toast.on{animation:toast 2.4s forwards}
@keyframes toast{8%,80%{opacity:1}100%{opacity:0}}
.mute{position:fixed;right:calc(12px + env(safe-area-inset-right,0px));top:calc(12px + env(safe-area-inset-top,0px));z-index:30;width:40px;height:40px;border-radius:50%;border:2px solid var(--ink);background:var(--paper);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0;box-shadow:2px 2px 0 var(--ink)}
.mute svg{width:18px;height:18px}
.fxl{position:fixed;inset:0;pointer-events:none;z-index:25;overflow:hidden}
.cf{position:absolute;top:-14px;width:9px;height:14px;border-radius:2px;animation:fall var(--d) cubic-bezier(.25,.6,.5,1) forwards}
@keyframes fall{to{transform:translate(var(--x),105vh) rotate(var(--r))}}
.sp{position:absolute;width:8px;height:8px;border-radius:50%;animation:sp .5s ease-out forwards}
@keyframes sp{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.orb{width:22px;height:22px;border-radius:50%;border:2px solid var(--ink);flex:none;transition:background .5s;animation:orb 1.6s ease-in-out infinite}
@keyframes orb{50%{transform:scale(1.15)}}
.orbtxt{margin:-6px 0 0;font:500 12px var(--f-body);color:var(--mute)}
.qwrap{display:grid;gap:14px;animation:qin .35s cubic-bezier(.2,1.2,.5,1)}
@keyframes qin{from{transform:translateX(30px);opacity:0}}
.opt.chosen{background:var(--ink);color:var(--paper);transform:scale(1.03)}
.opt.chosen b{color:var(--hl)}
.opt:disabled{cursor:default}
.pop{animation:popin .5s cubic-bezier(.2,1.6,.5,1) backwards}
@keyframes popin{from{transform:scale(0) rotate(-20deg)}}
.calc{min-height:60vh;display:grid;place-items:center;align-content:center;gap:18px}
.wheel{width:150px;height:150px;border-radius:50%;border:4px solid var(--ink);box-shadow:4px 4px 0 var(--ink);animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.calctxt{font:900 18px var(--f-body);margin:0}
.bigname{font:900 34px/1.1 var(--f-body);margin:-6px 0 0;animation:popin .6s cubic-bezier(.2,1.6,.5,1) .2s backwards}
@media (prefers-reduced-motion:reduce){.opt,.cardimg,.qwrap,.pop,.bigname,.orb,.wheel{animation:none}}
</style>
</head>

  muteBtn.innerHTML=m?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M17 9l5 6M22 9l-5 6"/></svg>':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11"/></svg>'}
const muteBtn=document.createElement('button');muteBtn.className='mute';muteBtn.id='muteBtn';muteBtn.setAttribute('aria-label','聲音開關');document.body.appendChild(muteBtn);
muteBtn.onclick=()=>{initAudio();setMute(!muted);bgmStart()};setMute(muted);
const fxl=document.createElement('div');fxl.className='fxl';document.body.appendChild(fxl);
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function confetti(cols,n=90){if(reduce)return;for(let k=0;k<n;k++){const e=document.createElement('i');e.className='cf';e.style.left=Math.random()*100+'vw';e.style.background=cols[k%cols.length];
  e.style.setProperty('--x',(Math.random()*160-80)+'px');e.style.setProperty('--r',(Math.random()*900-450)+'deg');e.style.setProperty('--d',(1.4+Math.random()*1.4)+'s');e.style.animationDelay=Math.random()*.3+'s';fxl.appendChild(e);setTimeout(()=>e.remove(),3300)}}
function burst(el,col){if(reduce)return;const r=el.getBoundingClientRect();for(let k=0;k<10;k++){const e=document.createElement('i');e.className='sp';const a=Math.random()*6.28,d=30+Math.random()*40;
  e.style.left=(r.left+r.width*(.2+Math.random()*.6))+'px';e.style.top=(r.top+r.height/2)+'px';e.style.background=col;e.style.setProperty('--dx',Math.cos(a)*d+'px');e.style.setProperty('--dy',Math.sin(a)*d+'px');fxl.appendChild(e);setTimeout(()=>e.remove(),600)}}

/* ---------- flow ---------- */
let i=0,ans=[],QS=[];
function intro(){
  app.innerHTML=`<h1>你是<em>什麼顏色</em>的台灣人？</h1>
  <p class="lead">15 題，從深藍到深綠、藍皮綠骨到小粉紅，測出你在台灣政治光譜上的顏色，拿一張專屬綽號卡。題庫 38 題，每次抽的題目和順序都不一樣。十種顏色都會被吐槽，公平起見，大家一起痛。</p>
  <div class="spec" id="spec"></div>
  <div class="mascots" id="ms"></div>
  <button class="btn" id="go">開始測驗</button>
  <p class="note">純屬娛樂，不是科學分類，也不代表任何政黨。作答只在你的手機上計算，不會上傳或記錄。</p>`;
  const ms=document.getElementById('ms');ORDER.forEach((t,k)=>{const c=mini(t,64);c.style.animationDelay=k*.06+'s';c.className='pop';ms.appendChild(c)});
  document.getElementById('spec').innerHTML=ORDER.map(t=>`<span style="background:${TYPES[t].hex2?`linear-gradient(135deg,${TYPES[t].hex} 50%,${TYPES[t].hex2} 50%)`:TYPES[t].hex}">${TYPES[t].color}</span>`).join('');
  document.getElementById('go').onclick=()=>{initAudio();bgmStart();sfx.start();QS=draw();i=0;ans=[];question()};
}
function orbColor(){if(!ans.length)return'#c9c4bb';const n=score();const t=classifyN(n);return TYPES[t].hex}
function question(){
  const [,q,opts]=QS[i];
  app.innerHTML=`<div class="prog"><span class="orb" id="orb" style="background:${orbColor()}"></span><span>${i+1} / ${QS.length}</span><span class="trk"><i style="width:${i/QS.length*100}%"></i></span></div>
  <p class="orbtxt">${ans.length?'你的顏色正在變化…':'你的顏色還沒決定'}</p>
  <div class="qwrap" id="qw"><p class="q">${q}</p><div class="opts">${opts.map((o,k)=>`<button class="opt" data-k="${k}"><b>${'ABCDE'[k]}</b><span>${o[0]}</span></button>`).join('')}</div></div>
  ${i?'<button class="back" id="back">← 上一題</button>':''}`;
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    ans[i]=+b.dataset.k;sfx.pick(i);burst(b,orbColor());b.classList.add('chosen');
    app.querySelectorAll('.opt').forEach(x=>x.disabled=true);
    setTimeout(()=>{sfx.whoosh();i++;i<QS.length?question():reveal();window.scrollTo({top:0})},reduce?0:260)});
  const bk=document.getElementById('back');if(bk)bk.onclick=()=>{sfx.back();i--;ans.length=i;question()};
}
function score(){
  const n=Math.min(ans.length,QS.length),sub=QS.slice(0,n),raw={a:0,b:0,e:0,r:0,k:0};
  ans.slice(0,n).forEach((k,j)=>{const w=QS[j][2][k][1];for(const x in w)raw[x]+=w[x]});
  const R=range(sub),nz=x=>raw[x]>=0?(R[x].hi?raw[x]/R[x].hi:0):(R[x].lo?-raw[x]/R[x].lo:0);
  return{a:nz('a'),b:nz('b'),r:nz('r'),k:R.k.hi?raw.k/R.k.hi:0,e:(R.e.hi-R.e.lo)?(raw.e-R.e.lo)/(R.e.hi-R.e.lo):.5,raw};
}
function classifyN(s){
  if(s.e<=.18)return'gray';
  if(s.k>=.55||(s.k>=.4&&s.a<=-.4))return'pink';
  if(s.r>=.6&&Math.abs(s.b)<=.35)return'white';
  if(s.b<=-.4&&s.a>=.2)return'bskin';
  if(s.b>=.4&&s.a<=-.15)return'gskin';
  const v=s.a*.65+s.b*.35;
  if(v>=.7)return'dgreen';if(v>=.2)return'lgreen';if(v<=-.7)return'dblue';if(v<=-.2)return'lblue';return'mid';
}
const specPos=s=>Math.max(.03,Math.min(.97,.5+(s.a*.65+s.b*.35)/2-(s.k>=.55?.12:0)));
function reveal(){
  app.innerHTML=`<div class="calc"><div class="wheel" id="wheel"></div><p class="calctxt" id="ct">分析你的政治顏色中…</p></div>`;
  const w=document.getElementById('wheel');w.style.background=`conic-gradient(${ORDER.map(t=>TYPES[t].hex).join(',')},${TYPES[ORDER[0]].hex})`;
  sfx.drum();const lines=['比對 38 題題庫…','計算藍綠濃度…','偵測小粉紅成分…','顏色出爐！'];
  lines.forEach((l,k)=>setTimeout(()=>{const ct=document.getElementById('ct');if(ct)ct.textContent=l},k*380));
  setTimeout(result,reduce?0:1550);
}
function wrap(ctx,text,x,y,maxW,lh){let line='',yy=y;for(const ch of text){const t=line+ch;if(ctx.measureText(t).width>maxW&&line){ctx.fillText(line,x,yy);line=ch;yy+=lh}else line=t}ctx.fillText(line,x,yy);return yy+lh}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function drawCard(type,s){
  const T=TYPES[type],W=1080,H=1350,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  const F='"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif';
  x.fillStyle='#1c1b22';rr(x,0,0,W,H,56);x.fill();
  if(T.hex2){const g=x.createLinearGradient(0,0,W,H);g.addColorStop(.5,T.hex);g.addColorStop(.5,T.hex2);x.fillStyle=g}else x.fillStyle=T.hex;
  rr(x,24,24,W-48,H-48,40);x.fill();
  x.fillStyle='#ffffff18';for(let yy=40;yy<540;yy+=26)for(let xx=40;xx<W-40;xx+=26){x.beginPath();x.arc(xx+(yy/26%2)*13,yy,4,0,7);x.fill()}
  x.fillStyle='#fff';x.font=`700 34px ${F}`;x.fillText('台灣政治顏色卡',72,98);
  x.textAlign='right';x.font=`700 30px ${F}`;x.fillText('No.'+String(ORDER.indexOf(type)+1).padStart(2,'0'),W-72,98);x.textAlign='left';
  x.fillStyle='#fff';rr(x,72,130,W-144,400,28);x.fill();x.lineWidth=6;x.strokeStyle='#1c1b22';x.stroke();
  x.fillStyle=T.hex+'22';x.beginPath();x.arc(W/2,330,170,0,7);x.fill();
  mascot(x,T.m,W/2,335,215,T.hex,T.hex2);
  /* color chip + nickname */
  x.font=`900 52px ${F}`;const cw=x.measureText(T.color).width+56;
  x.fillStyle='#fff';rr(x,72,568,cw,80,40);x.fill();x.fillStyle=T.hex2||T.hex;x.fillText(T.color,100,627);
  x.fillStyle='#fff';x.font=`900 104px ${F}`;x.fillText(T.name,72+cw+28,640);
  x.font=`700 38px ${F}`;x.fillStyle='#ffffffe6';x.fillText(T.tag,76,710);
  /* traits */
  x.fillStyle='#fff';rr(x,72,745,W-144,300,24);x.fill();
  x.fillStyle='#1c1b22';x.font=`500 33px ${F}`;let y=805;
  T.traits.forEach(t=>{x.fillStyle=T.hex;x.beginPath();x.arc(100,y-12,9,0,7);x.fill();x.fillStyle='#1c1b22';y=wrap(x,t,124,y,W-230,44)+6});
  x.font=`900 32px ${F}`;x.fillStyle=T.hex;x.fillText('口頭禪',100,y+14);x.fillStyle='#1c1b22';x.font=`700 32px ${F}`;wrap(x,'「'+T.quote+'」',220,y+14,W-310,42);
  /* spectrum bar */
  const bx=76,bw=W-152,by=1100;const g2=x.createLinearGradient(bx,0,bx+bw,0);
  g2.addColorStop(0,'#e2669b');g2.addColorStop(.12,'#1f3f8f');g2.addColorStop(.32,'#6b93d6');g2.addColorStop(.5,'#d9d6cf');g2.addColorStop(.68,'#8fcf8a');g2.addColorStop(1,'#147a4c');
  x.fillStyle='#1c1b2233';rr(x,bx-6,by-6,bw+12,44,22);x.fill();x.fillStyle=g2;rr(x,bx,by,bw,32,16);x.fill();
  const px=bx+bw*specPos(s);x.fillStyle='#fff';x.beginPath();x.arc(px,by+16,24,0,7);x.fill();x.lineWidth=7;x.strokeStyle='#1c1b22';x.stroke();
  x.font=`700 26px ${F}`;x.fillStyle='#fff';x.fillText('統',bx,by+78);x.textAlign='center';x.fillText('中間',bx+bw/2,by+78);x.textAlign='right';x.fillText('獨',bx+bw,by+78);
  x.textAlign='left';x.font=`700 30px ${F}`;x.fillText('天敵：'+T.enemy,76,1262);
  x.textAlign='right';x.font=`700 28px ${F}`;x.fillStyle='#ffffffcc';x.fillText('你是什麼顏色？',W-76,1262);x.textAlign='left';
  return c;
}
function result(){
  const s=score(),type=classifyN(s),T=TYPES[type];
  sfx.reveal();setTimeout(()=>confetti([T.hex,T.hex2||'#ffffff','#ffcc33',T.hex]),150);
  const pc=v=>Math.max(4,Math.min(96,v));
  const SITE=/github\.io$|^(?!.*claude).*\.(com|tw|net|app)$/.test(location.hostname)&&location.protocol.startsWith('http')?location.origin+location.pathname:'';
  const lean=v=>v>=.5?'偏綠':v>=.15?'微綠':v<=-.5?'偏藍':v<=-.15?'微藍':'不偏';
  const heat=s.e>=.7?'熱血':s.e>=.4?'普通':'冷感';
  const hooks=['測完被說中，有點痛','十種顏色裡我是這個，不意外','結果出來我沉默了','朋友說我就是這種人'];
  const VARIANTS={
    full:()=>`我是「${T.color}・${T.name}」🎨 ${T.tag}\n口頭禪：「${T.quote}」\n你是什麼顏色？👇${SITE?'\n'+SITE:''}\n#政治顏色卡`,
    short:()=>`${pick(hooks)}。我是「${T.color}・${T.name}」：${T.tag}。\n你是什麼顏色？${SITE?'\n'+SITE:''}`,
    tag:()=>`我測出來是「${T.color}・${T.name}」，口頭禪是「${T.quote}」😂\n我覺得 @_____ 一定是「${TYPES[ORDER[(ORDER.indexOf(type)+5)%ORDER.length]].color}・${TYPES[ORDER[(ORDER.indexOf(type)+5)%ORDER.length]].name}」，來測測看${SITE?'\n'+SITE:''}`
  };
  const pick=a=>a[Math.random()*a.length|0];
  let variant='full',share=VARIANTS.full();
  app.innerHTML=`<p class="lead" style="margin:0">你的政治顏色卡</p><p class="bigname" style="color:${T.hex2||T.hex}">${T.color}・${T.name}</p>
  <img class="cardimg" id="card" alt="${T.color}・${T.name}：${T.tag}">
  <p class="save">手機長按卡片就能存圖，直接發 Threads</p>
  <div class="axes">
    <div class="ax"><b>國家認同光譜</b><div class="ends"><span>在台灣的中國人</span><span>中華民國台灣</span><span>台灣國的台灣人</span></div><div class="trk"><span class="dot" style="left:${pc(50+s.a*48)}%"></span></div></div>
    <div class="ax"><b>政黨傾向</b><div class="ends"><span>國民黨</span><span>不分</span><span>民進黨</span></div><div class="trk"><span class="dot" style="left:${pc(50+s.b*48)}%"></span></div></div>
    <div class="ax"><b>政治熱度</b><div class="ends"><span>冷感</span><span>熱血</span></div><div class="trk e"><span class="dot" style="left:${pc(s.e*100)}%"></span></div></div>
    <div class="ax"><b>反兩黨指數</b><div class="ends"><span>還是相信政黨</span><span>兩黨都爛</span></div><div class="trk r"><span class="dot" style="left:${pc(50+s.r*48)}%"></span></div></div>
  </div>
  <section class="sharebox">
    <div class="shead"><b>分享文案</b><div class="vtabs" id="vtabs"><button data-v="full" aria-pressed="true">標準</button><button data-v="short" aria-pressed="false">一句話</button><button data-v="tag" aria-pressed="false">標記朋友</button></div></div>
    <textarea id="shareText" rows="9" aria-label="分享文案，可以直接修改"></textarea>
    <p class="hint">可以直接改文字再複製。發 Threads 時記得附上你的卡片圖。</p>
    <div class="srow"><button class="btn" id="copy">複製文案</button><button class="btn ghost" id="nshare" hidden>分享到…</button></div>
    <p class="toast" id="toast" role="status" aria-live="polite"></p>
  </section>
  <button class="btn ghost" id="again">再測一次（換一組題目）</button>
  <h2>全部十種顏色</h2><div class="gal" id="gal"></div>
  <p class="note">純屬娛樂，結果只依你的作答計算，不會上傳。每一型都被吐槽到同樣程度，請笑著轉發。</p>`;
  const img=document.getElementById('card');
  const paint=()=>{img.src=drawCard(type,s).toDataURL('image/png')};
  (document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(paint);paint();
  const gal=document.getElementById('gal');
  ORDER.forEach(t=>{const d=document.createElement('div');d.className='gi'+(t===type?' me':'');d.appendChild(mini(t,56));
    const tx=document.createElement('div');tx.innerHTML=`<b style="color:${TYPES[t].hex2||TYPES[t].hex}">${TYPES[t].color}・${TYPES[t].name}</b>${t===type?'　← 你':''}<span>${TYPES[t].tag}・「${TYPES[t].quote}」</span>`;d.appendChild(tx);gal.appendChild(d)});
  document.getElementById('again').onclick=()=>{sfx.start();QS=draw();i=0;ans=[];question();window.scrollTo({top:0})};
  const ta=document.getElementById('shareText'),toast=document.getElementById('toast'),cb=document.getElementById('copy');
  ta.value=share;
  const say=t=>{toast.textContent=t;toast.classList.remove('on');void toast.offsetWidth;toast.classList.add('on')};
  document.querySelectorAll('#vtabs button').forEach(b=>b.onclick=()=>{variant=b.dataset.v;ta.value=VARIANTS[variant]();sfx.pick(3);
    document.querySelectorAll('#vtabs button').forEach(x=>x.setAttribute('aria-pressed',x===b?'true':'false'))});
  cb.onclick=()=>{const t=ta.value;
    const fb=()=>{ta.focus();ta.select();ta.setSelectionRange(0,t.length);try{if(document.execCommand('copy')){done();return}}catch(e){}say('已幫你全選，長按文字選「拷貝」')};
    const done=()=>{cb.textContent='已複製 ✓';sfx.pick(6);say('文案已複製，去 Threads 貼上吧');setTimeout(()=>cb.textContent='複製文案',1800)};
    try{navigator.clipboard.writeText(t).then(done,fb)}catch(e){fb()}};
  /* native share sheet (works on the public site; hidden where the viewer blocks it) */
  const ns=document.getElementById('nshare');
  if(SITE&&navigator.share){ns.hidden=false;
    ns.onclick=async()=>{try{const blob=await (await fetch(img.src)).blob(),file=new File([blob],'政治顏色卡.png',{type:'image/png'});
      if(navigator.canShare&&navigator.canShare({files:[file]}))await navigator.share({files:[file],text:ta.value});else await navigator.share({text:ta.value,url:SITE})}catch(e){}}}

}
intro();
})();
</script>
